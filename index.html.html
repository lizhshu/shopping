<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>表格点击复制工具</title>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin:0;
            padding:0;
            font-family: system-ui, sans‑serif;
        }
        body {
            background:#f5f7fa;
            padding:20px;
        }
        .container {
            max-width:1400px;
            margin:0 auto;
        }
        .header-area {
            margin-bottom:16px;
        }
        h1 {
            font-size:22px;
            margin-bottom:12px;
        }
        .upload-wrap {
            background:#fff;
            padding:16px;
            border-radius:8px;
            box-shadow:0 1px 4px rgba(0,0,0,0.08);
            margin-bottom:16px;
        }
        #fileInput {
            margin-right:12px;
        }
        .btn {
            padding:8px 14px;
            border:none;
            border-radius:6px;
            background:#2563eb;
            color:#fff;
            cursor:pointer;
        }
        .btn:hover {
            background:#1d4ed8;
        }
        .table-scroll-wrap {
            overflow-x:auto;
            background:#fff;
            border-radius:8px;
            box-shadow:0 1px 4px rgba(0,0,0,0.08);
        }
        table {
            border-collapse: collapse;
            min-width:100%;
        }
        th, td {
            border:1px solid #d1d5db;
            padding:10px 12px;
            text-align:left;
            white-space:nowrap;
        }
        th {
            background:#e2e8f0;
            font-weight:600;
            position:sticky;
            top:0;
        }
        td {
            cursor:pointer;
            transition:background 0.15s;
        }
        td:hover {
            background:#dbeafe;
        }

        /* Toast弹窗 */
        .toast {
            position:fixed;
            bottom:30px;
            left:50%;
            transform:translateX(-50%);
            background:#1f2937;
            color:#fff;
            padding:12px 24px;
            border-radius:8px;
            z-index:9999;
            opacity:0;
            pointer-events:none;
            transition:opacity 0.25s;
        }
        .toast.show {
            opacity:1;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header-area">
        <h1>表格点击复制工具｜点击单元格自动复制内容</h1>
    </div>

    <div class="upload-wrap">
        <input type="file" id="fileInput" accept=".xlsx,.xls,.csv">
        <button class="btn" id="loadDemoBtn">加载演示样品数据</button>
        <p style="margin-top:8px;font-size:13px;color:#555;">支持上传Excel(xlsx/xls)、CSV；点击任意单元格复制文本；下方内置产品样例可直接测试</p>
    </div>

    <div class="table-scroll-wrap">
        <table id="dataTable">
            <thead></thead>
            <tbody></tbody>
        </table>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
    const toastEl = document.getElementById('toast');
    const tableThead = document.querySelector('#dataTable thead');
    const tableTbody = document.querySelector('#dataTable tbody');

    // 弹窗提示
    function showToast(msg) {
        toastEl.textContent = msg;
        toastEl.classList.add('show');
        setTimeout(()=>{
            toastEl.classList.remove('show');
        },1800);
    }

    // 复制文本
    async function copyText(text) {
        try {
            await navigator.clipboard.writeText(String(text));
            showToast(`✅已复制：${text}`);
        } catch(err) {
            // 降级复制
            const ta = document.createElement('textarea');
            ta.value = text;
            document.body.appendChild(ta);
            ta.select();
            document.execCommand('copy');
            document.body.removeChild(ta);
            showToast(`✅已复制：${text}`);
        }
    }

    // 渲染表格
    function renderTable(headers, rows) {
        tableThead.innerHTML = '';
        tableTbody.innerHTML = '';

        // 表头
        const trHead = document.createElement('tr');
        headers.forEach(h=>{
            const th = document.createElement('th');
            th.innerText = h;
            trHead.appendChild(th);
        });
        tableThead.appendChild(trHead);

        // 数据行
        rows.forEach(row=>{
            const tr = document.createElement('tr');
            row.forEach(cellVal=>{
                const td = document.createElement('td');
                td.innerText = (cellVal===null || cellVal===undefined) ? '' : cellVal;
                td.addEventListener('click', ()=>{
                    copyText(td.innerText);
                });
                tr.appendChild(td);
            });
            tableTbody.appendChild(tr);
        })
    }

    // 文件上传解析
    document.getElementById('fileInput').addEventListener('change', function(e){
        const file = e.target.files[0];
        if(!file) return;
        const reader = new FileReader();
        reader.onload = function(ev){
            const workbook = XLSX.read(ev.target.result, {type:'binary'});
            const sheetName = workbook.SheetNames[0];
            const worksheet = workbook.Sheets[sheetName];
            const jsonData = XLSX.utils.sheet_to_json(worksheet, {header:1});
            if(jsonData.length <1) {
                showToast("表格无数据");
                return;
            }
            const headers = jsonData[0];
            const bodyRows = jsonData.slice(1);
            renderTable(headers, bodyRows);
            showToast("📂文件加载完成");
        }
        reader.readAsBinaryString(file);
    })
